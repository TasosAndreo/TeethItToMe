<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Greek Medical Speech-to-Text</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app-container">

        <header class="app-header">
            <h1>Greek Medical Speech-to-Text</h1>
            <p>Μετατροπή ελληνικής ομιλίας σε κείμενο</p>
        </header>


        <section class="recording-card">

            <div class="status-container">
                <span id="statusIndicator" class="status-indicator"></span>
                <span id="statusText">Έτοιμο για εγγραφή</span>
            </div>


            <div class="recording-controls">

                <button id="recordButton" class="record-button">
                    🎙️
                    <span>Έναρξη εγγραφής</span>
                </button>

                <button id="stopButton" class="stop-button" disabled>
                    ⏹
                    <span>Διακοπή</span>
                </button>

            </div>
            
            <div class="upload-container">

                <input
                    type="file"
                    id="audioFile"
                    accept="audio/*"
                    hidden
            >

                <button id="uploadButton" class="upload-button">
                    📁
                    <span>Upload Audio</span>
                </button>

            </div>

            <div class="timer">
                <span id="timer">00:00</span>
            </div>


            <div class="audio-container">
                <audio id="audioPlayer" controls></audio>
            </div>

        </section>


        <section class="transcription-card">

            <div class="section-header">
                <h2>Μεταγραφή</h2>

                <button type="button" id="clearButton" class="clear-button">
                    Καθαρισμός
                </button>
            </div>

            <div class="transcription-container">
                <label for="transcriptionText">Transcription</label>

                <textarea
                    id="transcriptionText"
                    placeholder="Η απομαγνητοφώνηση θα εμφανιστεί εδώ..."
                    spellcheck="true"
                ></textarea>
                
                <button id="saveTranscriptButton" type="button">
                    Save Changes
                </button>

                <p id="saveStatus"></p>
            </div>

        </section>
        
        <section class="history-card">

            <div class="section-header">
                <h2>Αποθηκευμένες εγγραφές</h2>
            </div>

            <div id="recordingsList" class="recordings-list">
                <p>Δεν υπάρχουν αποθηκευμένες εγγραφές.</p>
            </div>

        </section>

        <footer>
            <p>Teeth It To Me — Development Version</p>
        </footer>

    </main>


    <script src="script.js"></script>

</body>
</html>
